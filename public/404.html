<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRC Academy</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/academy\/?/, '/');
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var target = '/academy/?redirect=' + encodeURIComponent(path + search + hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
